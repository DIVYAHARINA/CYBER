<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="College login page — secure sign in for students and staff.">
    <title>College Login</title>

    <style>
        :root{
            --brand-1: #1e3c72;
            --brand-2: #2a5298;
            --bg: #f6f8fb;
            --muted: #6b7280;
            --success: #27ae60;
            --danger: #c0392b;
            --card-radius: 14px;
            --max-width: 420px;
        }

        *{box-sizing:border-box}
        html,body{height:100%}
        body{
            margin:0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            background: linear-gradient(135deg,var(--brand-1),var(--brand-2));
            display:flex;
            align-items:center;
            justify-content:center;
            padding:32px;
            color:#111827;
        }

        .login-container{
            width:100%;
            max-width:var(--max-width);
            background:white;
            padding:28px;
            border-radius:var(--card-radius);
            box-shadow:0 12px 30px rgba(2,6,23,0.35);
        }

        header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
        .logo{width:64px;height:64px;object-fit:contain;border-radius:8px}
        h1{font-size:1.25rem;color:var(--brand-1);margin:0}
        .subtitle{color:var(--muted);font-size:.95rem;margin-top:4px}

        form{margin-top:12px}
        .field{margin-bottom:14px}
        label{display:block;font-weight:600;margin-bottom:6px;color:#374151;font-size:.94rem}
        input[type="text"],input[type="password"]{
            width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:0.95rem;
        }
        input:focus{outline:3px solid rgba(30,60,114,0.12);border-color:var(--brand-1)}

        .row{display:flex;gap:10px;align-items:center}
        .remember{font-size:.9rem;color:var(--muted)}

        .controls{display:flex;gap:10px;align-items:center;margin-top:6px}
        .login-btn{flex:1;padding:12px;border-radius:8px;border:none;background:linear-gradient(180deg,var(--brand-1),var(--brand-2));color:#fff;font-weight:600;cursor:pointer}
        .login-btn[disabled]{opacity:.6;cursor:not-allowed}

        .link{color:var(--brand-1);text-decoration:none;font-size:.92rem}
        .link:hover{text-decoration:underline}

        .message{min-height:20px;margin-top:12px;font-size:.95rem}
        .message.error{color:var(--danger)}
        .message.success{color:var(--success)}

        .password-wrap{position:relative}
        .toggle-pw{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--brand-1);cursor:pointer;padding:6px;border-radius:6px}

        /* Responsive small screens */
        @media (max-width:420px){
            body{padding:16px}
            .login-container{padding:20px}
        }

        /* Visually hide but keep for screen readers */
        .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    </style>
</head>

<body>
    <main class="login-container" role="main" aria-labelledby="login-heading">

        <header>
            <img src="apeclogo.jpeg" alt="Apec College logo" class="logo" loading="lazy">
            <div>
                <h1 id="login-heading">College Login</h1>
                <div class="subtitle" id="login-subtitle">Welcome — sign in to continue</div>
            </div>
        </header>

        <!-- If JavaScript is disabled show a short fallback -->
        <noscript>
            <div class="message error">This site requires JavaScript for client-side validation. Please ensure JavaScript is enabled.</div>
        </noscript>

        <form id="login-form" novalidate aria-describedby="login-subtitle">

            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" inputmode="text" autocomplete="username" placeholder="e.g. student01" required aria-required="true" aria-describedby="username-help">
                <div id="username-help" class="sr-only">Enter your college username, for example student ID or email local-part.</div>
            </div>

            <div class="field password-wrap">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required aria-required="true" minlength="4" aria-describedby="password-help">
                <button type="button" class="toggle-pw" id="toggle-password" aria-pressed="false" aria-label="Show password">Show</button>
                <div id="password-help" class="sr-only">Your account password. Minimum 4 characters for demo.</div>
            </div>

            <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
                <label class="remember"><input type="checkbox" id="remember" name="remember"> Remember me</label>
                <a href="#" class="link" id="forgot-link">Forgot password?</a>
            </div>

            <div class="controls">
                <button type="submit" class="login-btn" id="login-btn">Login</button>
            </div>

            <div id="login-message" class="message" role="status" aria-live="polite"></div>
        </form>

    </main>

    <script>
        (function(){
            const form = document.getElementById('login-form');
            const msg = document.getElementById('login-message');
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            const btn = document.getElementById('login-btn');
            const toggle = document.getElementById('toggle-password');

            function setMessage(text, type){
                msg.textContent = text;
                msg.classList.remove('error','success');
                if(type) msg.classList.add(type);
            }

            // Toggle password visibility
            toggle.addEventListener('click', function(){
                const isPwd = password.type === 'password';
                password.type = isPwd ? 'text' : 'password';
                toggle.textContent = isPwd ? 'Hide' : 'Show';
                toggle.setAttribute('aria-pressed', String(isPwd));
                // keep focus on the input for keyboard users
                password.focus();
            });

            // Focus username on load for quicker keyboard access
            username.focus();

            form.addEventListener('submit', function(e){
                e.preventDefault();
                setMessage('', null);
                username.removeAttribute('aria-invalid');
                password.removeAttribute('aria-invalid');

                const userVal = username.value.trim();
                const passVal = password.value;

                // simple client-side checks
                if(!userVal){
                    setMessage('Please enter your username.', 'error');
                    username.setAttribute('aria-invalid', 'true');
                    username.focus();
                    return;
                }

                if(!passVal){
                    setMessage('Please enter your password.', 'error');
                    password.setAttribute('aria-invalid', 'true');
                    password.focus();
                    return;
                }

                if(passVal.length < 4){
                    setMessage('Password is too short.', 'error');
                    password.setAttribute('aria-invalid', 'true');
                    password.focus();
                    return;
                }

                // Demo authentication - replace with real authentication on the server
                btn.disabled = true;
                btn.textContent = 'Signing in...';

                // Simulate async auth request
                setTimeout(function(){
                    btn.disabled = false;
                    btn.textContent = 'Login';

                    // NOTE: remove demo credentials in production. This is only for UI demo.
                    if(userVal.toLowerCase() === 'admin' && passVal === '1234'){
                        setMessage('Login successful — redirecting...', 'success');
                        // On real success, redirect to dashboard: location.href = '/dashboard.html';
                        setTimeout(function(){
                            form.reset();
                            username.focus();
                            setMessage('', null);
                        },700);
                    } else {
                        setMessage('Invalid username or password.', 'error');
                        password.setAttribute('aria-invalid','true');
                        password.focus();
                    }

                }, 700);
            });

            // Improve keyboard discoverability: Enter in password should submit form (default behavior preserved)
            // Prevent storing credentials locally in demo environment
            window.addEventListener('beforeunload', function(){
                form.reset();
            });
        })();
    </script>
</body>
</html>
