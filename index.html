<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .login-container {
            width: 350px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        h2 {
            color: #1e3c72;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-box {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-size: 14px;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #1e3c72;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #1e3c72;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #16305c;
        }

        .forgot {
            display: block;
            margin-top: 18px;
            color: #1e3c72;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 12px;
            font-size: 14px;
            color: #c0392b;
            min-height: 18px;
        }

        .message.success { color: #27ae60; }
    </style>
</head>

<body>

    <div class="login-container" role="region" aria-labelledby="login-heading">

        <!-- College Logo -->
        <img
            class="logo"
            src="apeclogo.jpeg"
            alt="Apecka College logo"
        >

        <h2 id="login-heading">College Login</h2>
        <p class="subtitle" id="login-subtitle">Welcome! Please login to continue</p>

        <form id="login-form" novalidate aria-describedby="login-subtitle">

            <div class="input-box">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                    aria-required="true"
                >
            </div>

            <div class="input-box">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                    aria-required="true"
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <div class="message" id="login-message" role="status" aria-live="polite"></div>

        </form>

        <a href="#" class="forgot">Forgot Password?</a>

    </div>

    <script>
        // Attach event listener instead of inline onsubmit
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('login-form');
            const messageEl = document.getElementById('login-message');

            form.addEventListener('submit', function (event) {
                event.preventDefault();
                messageEl.textContent = '';
                messageEl.classList.remove('success');

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                // Basic client-side validation
                if (!username || !password) {
                    messageEl.textContent = 'Please enter both username and password.';
                    return;
                }

                // Demo login: replace with real authentication in production
                if (username === 'admin' && password === '1234') {
                    messageEl.textContent = 'Login successful! Redirecting...';
                    messageEl.classList.add('success');

                    // Simulate redirect after short delay
                    setTimeout(function () {
                        // If you have a dashboard page, change the location to it
                        // location.href = '/dashboard.html';
                        // For now, just clear the form
                        form.reset();
                    }, 800);
                } else {
                    messageEl.textContent = 'Invalid username or password!';
                }
            });
        });
    </script>

</body>
</html>
